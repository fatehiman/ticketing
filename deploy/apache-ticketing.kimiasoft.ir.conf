# Ticketing — Laravel 12. Public: https://ticketing.kimiasoft.ir (ArvanCloud CDN terminates public TLS).
# Origin: waybill VPS, 130.185.76.10. BOTH :80 and :443 are served because Arvan picks the
# origin protocol per host and a :80-only vhost returns 502 through the CDN if it chose HTTPS.
#
# PHP runs under mod_php (no PHP-FPM on this box). Docroot is public/; .env lives one level
# above it and everything outside public/ is denied.
# Installed at /etc/apache2/sites-available/ticketing.kimiasoft.ir.conf

<Macro Ticketing>
    ServerName ticketing.kimiasoft.ir
    ServerAlias www.ticketing.kimiasoft.ir
    DocumentRoot /var/www/ticketing/public

    <Directory /var/www/ticketing/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
        FallbackResource /index.php
    </Directory>

    # Never serve anything from outside the docroot.
    <Directory /var/www/ticketing>
        Require all denied
    </Directory>
    <DirectoryMatch "^/var/www/ticketing/public/.*/\.(?!well-known)">
        Require all denied
    </DirectoryMatch>

    # Attachments: up to 10 files of 10 MB each (same limits as the deb10 nginx vhost).
    LimitRequestBody 115343360
    php_value upload_max_filesize 12M
    php_value post_max_size 110M
    php_value max_file_uploads 20

    ErrorLog  ${APACHE_LOG_DIR}/ticketing.kimiasoft.ir-error.log
    CustomLog ${APACHE_LOG_DIR}/ticketing.kimiasoft.ir-access.log combined
</Macro>

<VirtualHost *:80>
    Use Ticketing
</VirtualHost>

<VirtualHost *:443>
    Use Ticketing
    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/ticketing.kimiasoft.ir.crt
    SSLCertificateKeyFile /etc/ssl/private/ticketing.kimiasoft.ir.key
</VirtualHost>

UndefMacro Ticketing
