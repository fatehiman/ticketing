# Ticketing — nginx vhost for the LAN server (deb10, 192.168.1.10).
# Installed at /etc/nginx/sites-available/ticketing, symlinked into sites-enabled/.
# Plain HTTP (LAN only). Name resolution is by hosts file: 192.168.1.10 ticketing.localkimia.com

server {
    listen 80;
    listen [::]:80;
    server_name ticketing.localkimia.com;

    root /var/www/ticketing/public;
    index index.php;
    charset utf-8;

    # Up to 10 attachments of 10 MB each in one form.
    client_max_body_size 110m;

    access_log /var/log/nginx/ticketing.access.log;
    error_log  /var/log/nginx/ticketing.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Built assets and the self-hosted editor have hashed/versioned names.
    location ~* ^/(build|vendor)/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        # The box has one shared PHP-FPM pool with a 2 MB upload limit;
        # raise it for this site only.
        fastcgi_param PHP_VALUE "upload_max_filesize=12M
post_max_size=110M
max_file_uploads=20";
        fastcgi_read_timeout 120s;
    }

    # Never serve PHP from the public storage link (user uploads).
    location ~ ^/storage/.*\.(php|phtml|phar)$ { deny all; }

    location ~ /\.(?!well-known).* { deny all; }
}
